<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40">
  <!-- Background -->
  <rect width="40" height="40" fill="#8B3A3A"/>

  <!-- Double frame - hand drawn feel -->
  <rect x="3" y="3" width="34" height="34" fill="none" stroke="#FAF6F0" stroke-width="1" opacity="0.85"/>
  <rect x="6" y="6" width="28" height="28" fill="none" stroke="#FAF6F0" stroke-width="0.5" opacity="0.5"/>

  <!-- Horizon line -->
  <path d="M10 26 Q20 25.5 30 26" stroke="#FAF6F0" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.9"/>

  <!-- Sun arc -->
  <path d="M11 26 Q16 14 20 12 Q24 14 29 26" stroke="#D4A04A" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Sun rays -->
  <line x1="20" y1="9" x2="20" y2="6" stroke="#D4A04A" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="13" y1="13" x2="10" y2="10" stroke="#D4A04A" stroke-width="1" stroke-linecap="round"/>
  <line x1="27" y1="13" x2="30" y2="10" stroke="#D4A04A" stroke-width="1" stroke-linecap="round"/>
</svg>
