<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Archive — SUNSIDE</title>
  <meta name="description" content="Browse all past issues of SUNSIDE, the local newsletter for Horizon West.">
  <meta property="og:title" content="Archive — SUNSIDE">
  <meta property="og:description" content="Browse all past issues of SUNSIDE, the local newsletter for Horizon West.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://readsunside.com/newsletter">
  <meta property="og:image" content="https://readsunside.com/og-image.png">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800;900&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --terracotta: #8B3A3A;
      --terracotta-light: #A65050;
      --cream: #FAF6F0;
      --cream-dark: #F0EBE3;
      --charcoal: #2C2C2C;
      --charcoal-light: #555555;
      --ochre: #D4A04A;
      --ochre-light: #E8C882;
      --white: #FFFFFF;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      font-family: 'DM Sans', sans-serif;
      background-color: var(--cream);
      color: var(--charcoal);
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }

    .nav {
      padding: 1rem 2rem;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 2rem;
      position: relative;
      z-index: 10;
    }

    .nav-wordmark {
      font-family: 'Playfair Display', serif;
      font-weight: 800;
      font-size: 1.25rem;
      color: var(--terracotta);
      text-decoration: none;
      margin-right: 1rem;
    }

    .nav-wordmark:hover {
      color: var(--terracotta-light);
    }

    .nav-link {
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--charcoal-light);
      text-decoration: none;
      letter-spacing: 0.02em;
      padding: 0.5rem 0;
      position: relative;
      transition: color 0.2s ease;
    }

    .nav-link:hover,
    .nav-link.active {
      color: var(--terracotta);
    }

    .nav-link::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      width: 0;
      height: 2px;
      background: var(--ochre);
      transition: width 0.2s ease;
    }

    .nav-link:hover::after,
    .nav-link.active::after {
      width: 100%;
    }

    .archive {
      padding: 2rem 2rem 6rem;
      max-width: 900px;
      margin: 0 auto;
    }

    .section-label {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--ochre);
      margin-bottom: 1rem;
    }

    .section-title {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2rem, 5vw, 3rem);
      font-weight: 700;
      color: var(--terracotta);
      margin-bottom: 1rem;
      line-height: 1.15;
    }

    .section-intro {
      font-size: 1.1rem;
      line-height: 1.7;
      color: var(--charcoal-light);
      max-width: 600px;
      margin-bottom: 3rem;
    }

    .posts-loading {
      text-align: center;
      padding: 3rem;
      color: var(--charcoal-light);
    }

    .posts-empty {
      text-align: center;
      padding: 4rem 2rem;
      background: var(--white);
      border-radius: 8px;
      border: 1px dashed var(--cream-dark);
    }

    .posts-empty-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.5rem;
      color: var(--charcoal);
      margin-bottom: 0.5rem;
    }

    .posts-empty-text {
      color: var(--charcoal-light);
      margin-bottom: 1.5rem;
    }

    .posts-empty-link {
      color: var(--terracotta);
      font-weight: 600;
      text-decoration: none;
    }

    .posts-empty-link:hover {
      text-decoration: underline;
    }

    .posts-list {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .post-card {
      display: block;
      padding: 1.75rem 2rem;
      background: var(--white);
      border-radius: 8px;
      border: 1px solid var(--cream-dark);
      text-decoration: none;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .post-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(44, 44, 44, 0.08);
    }

    .post-date {
      font-size: 0.8rem;
      color: var(--ochre);
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 0.5rem;
    }

    .post-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--terracotta);
      margin-bottom: 0.5rem;
      line-height: 1.3;
    }

    .post-subtitle {
      font-size: 1rem;
      color: var(--charcoal-light);
      line-height: 1.5;
    }

    .footer {
      padding: 3rem 2rem;
      text-align: center;
      background: var(--cream);
      color: #2D4A3E;
    }

    .footer-wordmark {
      font-family: 'Playfair Display', serif;
      font-weight: 700;
      font-size: 1.5rem;
      color: #2D4A3E;
      margin-bottom: 0.5rem;
    }

    .footer-tagline {
      font-size: 0.85rem;
      color: var(--charcoal-light);
    }

    @media (max-width: 640px) {
      .nav {
        padding: 0.75rem 1rem;
        gap: 1rem;
      }

      .nav-wordmark {
        font-size: 1.1rem;
        margin-right: 0.5rem;
      }

      .nav-link {
        font-size: 0.8rem;
      }

      .archive {
        padding: 1.5rem 1.25rem 4rem;
      }

      .section-title {
        font-size: 1.75rem;
      }

      .section-intro {
        font-size: 1rem;
        margin-bottom: 2rem;
      }

      .post-card {
        padding: 1.25rem;
      }

      .post-title {
        font-size: 1.2rem;
      }

      .post-subtitle {
        font-size: 0.95rem;
      }

      .footer {
        padding: 2rem 1.25rem;
      }
    }
  </style>
</head>
<body>

  <nav class="nav">
    <a href="/" class="nav-wordmark">SUNSIDE</a>
  </nav>

  <main class="archive">
    <p class="section-label">Archive</p>
    <h1 class="section-title">Past Issues</h1>
    <p class="section-intro">Every Friday we cover what's worth doing, knowing, and talking about in Horizon West.</p>

    <div id="posts-container">
      <div class="posts-loading">Loading issues...</div>
    </div>
  </main>

  <footer class="footer">
    <p class="footer-wordmark">SUNSIDE</p>
    <p class="footer-tagline">The local newsletter for Horizon West.</p>
  </footer>

  <script>
    (async function() {
      const container = document.getElementById('posts-container');

      try {
        const response = await fetch('/api/posts?limit=50');
        const data = await response.json();

        if (!data.posts || data.posts.length === 0) {
          container.innerHTML = `
            <div class="posts-empty">
              <p class="posts-empty-title">No issues yet!</p>
              <p class="posts-empty-text">The first issue drops Friday, March 14.</p>
              <a href="/" class="posts-empty-link">Subscribe to get it in your inbox</a>
            </div>
          `;
          return;
        }

        const postsHtml = data.posts.map(post => {
          const date = new Date(post.publishedAt * 1000);
          const dateStr = date.toLocaleDateString('en-US', {
            weekday: 'long',
            year: 'numeric',
            month: 'long',
            day: 'numeric'
          });

          return `
            <a href="/newsletter/post.html?id=${post.id}" class="post-card">
              <p class="post-date">${dateStr}</p>
              <h2 class="post-title">${post.title}</h2>
              ${post.subtitle ? `<p class="post-subtitle">${post.subtitle}</p>` : ''}
            </a>
          `;
        }).join('');

        container.innerHTML = `<div class="posts-list">${postsHtml}</div>`;

      } catch (error) {
        console.error('Failed to load posts:', error);
        container.innerHTML = `
          <div class="posts-empty">
            <p class="posts-empty-title">Couldn't load issues</p>
            <p class="posts-empty-text">Please try again later.</p>
          </div>
        `;
      }
    })();
  </script>

</body>
</html>
