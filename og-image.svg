<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#FAF6F0"/>

  <!-- Subtle warm gradient overlay -->
  <defs>
    <radialGradient id="warmGlow" cx="50%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#D4A04A" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#D4A04A" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#warmGlow)"/>

  <!-- Social proof - top -->
  <text x="600" y="150" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#8B3A3A" letter-spacing="4" font-weight="500">JOIN YOUR NEIGHBORS</text>

  <!-- SUNSIDE wordmark - larger and more prominent -->
  <text x="600" y="295" text-anchor="middle" font-family="Georgia, 'Playfair Display', serif" font-size="140" font-weight="700" fill="#8B3A3A" letter-spacing="-3">SUNSIDE</text>

  <!-- Tagline -->
  <text x="600" y="365" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="32" fill="#555555">The local newsletter for Horizon West</text>

  <!-- Sunrise motif - centered arc -->
  <path d="M350 450 Q600 380 850 450" stroke="#D4A04A" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.7"/>

  <!-- Sun rays hint -->
  <line x1="530" y1="420" x2="510" y2="395" stroke="#D4A04A" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
  <line x1="600" y1="410" x2="600" y2="380" stroke="#D4A04A" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
  <line x1="670" y1="420" x2="690" y2="395" stroke="#D4A04A" stroke-width="3" stroke-linecap="round" opacity="0.4"/>

  <!-- Footer text with bullet -->
  <text x="600" y="540" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#555555" letter-spacing="1">Every Friday  •  Free forever</text>
</svg>
